<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remo · Sign in</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236e1d31'/%3E%3Crect x='6' y='11.5' width='3.2' height='9' rx='1.6' fill='%23faf5eb'/%3E%3Crect x='11.6' y='8.5' width='3.2' height='15' rx='1.6' fill='%23faf5eb'/%3E%3Crect x='6.5' y='14.4' width='7.8' height='3.2' rx='1.6' fill='%23faf5eb'/%3E%3Crect x='17.2' y='5.5' width='3.2' height='21' rx='1.6' fill='%234fb286'/%3E%3Crect x='22.8' y='12.5' width='3.2' height='7' rx='1.6' fill='%23faf5eb'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  try {
    var t = localStorage.getItem("remo-theme");
    if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
  } catch (e) {}
</script>
<link rel="stylesheet" href="/static/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
    background: var(--bg); color: var(--text);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    animation: page-in 0.25s ease;
  }
  @keyframes page-in { from { opacity: 0; } }
  .card {
    width: 100%; max-width: 24rem; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-lift); padding: 1.9rem 1.7rem 1.5rem;
  }
  .brand { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.35rem; }
  .mark {
    width: 2.4rem; height: 2.4rem; border-radius: 0.65rem; flex: none;
    background: var(--bordo); color: #faf5eb;
    display: grid; place-items: center;
  }
  .mark svg { width: 1.3rem; height: 1.3rem; }
  .brand strong { font-family: "Bricolage Grotesque", sans-serif; font-size: 1.25rem; display: block; }
  .brand span { font-size: 0.78rem; color: var(--muted); }
  .lede { font-size: 0.88rem; color: var(--muted); margin: 0.4rem 0 1.1rem; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; margin-bottom: 1rem; }
  .tabs button {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
    border-radius: 0.6rem; padding: 0.5rem; font: inherit; font-weight: 600; font-size: 0.86rem;
    cursor: pointer;
  }
  .tabs button.on { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin: 0.7rem 0 0.3rem; }
  input {
    width: 100%; border: 1px solid var(--border); border-radius: 0.6rem;
    background: var(--bg); color: var(--text); padding: 0.6rem 0.75rem; font: inherit; font-size: 0.92rem;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .submit {
    width: 100%; margin-top: 1.1rem; border: 0; border-radius: 0.65rem; cursor: pointer;
    background: var(--accent); color: #fff; font: inherit; font-weight: 700; font-size: 0.95rem;
    padding: 0.65rem;
  }
  .submit:disabled { opacity: 0.6; cursor: wait; }
  .error {
    display: none; margin-top: 0.9rem; font-size: 0.85rem; color: var(--bad);
    background: color-mix(in srgb, var(--bad) 10%, transparent);
    border: 1px solid var(--bad); border-radius: 0.6rem; padding: 0.55rem 0.75rem;
  }
  .error.show { display: block; }
  .error.ok { color: var(--accent); border-color: var(--accent);
    background: var(--accent-dim); }
  .divider { display: flex; align-items: center; gap: 0.7rem; margin: 1.2rem 0 0.9rem;
    color: var(--muted); font-size: 0.76rem; font-weight: 600; }
  .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
  .google {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    border: 1px solid var(--border); border-radius: 0.65rem; background: var(--surface-2);
    color: var(--text); font: inherit; font-weight: 600; font-size: 0.9rem;
    padding: 0.6rem; cursor: pointer; text-decoration: none;
  }
  .google svg { width: 1.05rem; height: 1.05rem; flex: none; }
  .google.off { opacity: 0.55; cursor: not-allowed; }
  .foot { margin-top: 1.2rem; text-align: center; font-size: 0.8rem; color: var(--muted); }
  .foot a { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="4.5" y="10.5" width="3.5" height="11" rx="1.75" fill="currentColor"/><rect x="10.8" y="7" width="3.5" height="18" rx="1.75" fill="currentColor"/><rect x="5" y="14.25" width="8.5" height="3.5" rx="1.75" fill="currentColor"/><rect x="17.1" y="4" width="3.5" height="24" rx="1.75" fill="currentColor" opacity="0.65"/><rect x="23.4" y="11.5" width="3.5" height="9" rx="1.75" fill="currentColor"/></svg></span>
      <div><strong>Remo</strong><span>Voice memory studio</span></div>
    </div>
    <p class="lede">Sign in to reach your voice memory.</p>
    <div class="tabs" role="tablist">
      <button id="tab-login" type="button" class="on">Sign in</button>
      <button id="tab-register" type="button">Register</button>
    </div>
    <form id="auth-form" autocomplete="on">
      <div id="name-wrap" hidden>
        <label for="f-name">Name</label>
        <input id="f-name" type="text" autocomplete="name" placeholder="Asha">
      </div>
      <label for="f-email">Email</label>
      <input id="f-email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="f-pass">Password</label>
      <input id="f-pass" type="password" autocomplete="current-password" placeholder="8+ characters" required>
      <button id="f-submit" class="submit" type="submit">Sign in</button>
      <p id="f-error" class="error" role="alert"></p>
    </form>
    <div class="divider">or</div>
    <a id="google-btn" class="google" href="/api/auth/google/start">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.5h6.5c-.1 1.1-.8 2.7-2.4 3.8l-.1.1 3.5 2.7.2.1c2.2-2 3.8-5 3.8-8.9z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.8-2.9c-1 .7-2.4 1.2-4.1 1.2-3.2 0-5.9-2.1-6.8-5.1l-.1.1-3.6 2.8v.1C3.5 21.3 7.5 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3l-.1-.1-3.5-2.7-.1.1C.5 8.9 0 10.4 0 12s.5 3.1 1.5 4.6l3.7-2.3z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.5 0 3.5 2.7 1.5 6.6l3.7 2.9c.9-3 3.6-4.8 6.8-4.8z"/></svg>
      <span id="google-label">Continue with Google</span>
    </a>
    <p class="foot"><a href="/">Back to homepage</a></p>
  </main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const errBox = $("f-error");
  let mode = "login";

  const ERROR_TEXT = {
    cancelled: "Google sign-in was cancelled.",
    expired: "That Google attempt expired. Please try again.",
    failed: "Google sign-in failed. Please try again.",
    unverified: "That Google account has no verified email.",
    not_configured: "Google sign-in is not configured on this server.",
  };
  function showError(text) {
    errBox.textContent = text;
    errBox.classList.add("show");
  }
  const params = new URLSearchParams(location.search);
  if (params.get("error") && ERROR_TEXT[params.get("error")]) showError(ERROR_TEXT[params.get("error")]);
  if (params.get("registered")) {
    errBox.textContent = "Account created. Sign in with your new password.";
    errBox.classList.add("show", "ok");
    const email = params.get("email");
    if (email) $("f-email").value = email;
  }

  function setMode(next) {
    mode = next;
    $("tab-login").classList.toggle("on", next === "login");
    $("tab-register").classList.toggle("on", next === "register");
    $("name-wrap").hidden = next !== "register";
    $("f-submit").textContent = next === "register" ? "Create account" : "Sign in";
    $("f-pass").setAttribute("autocomplete", next === "register" ? "new-password" : "current-password");
    errBox.classList.remove("show");
  }
  $("tab-login").onclick = () => setMode("login");
  $("tab-register").onclick = () => setMode("register");

  $("auth-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("f-submit");
    btn.disabled = true;
    errBox.classList.remove("show");
    const payload = { email: $("f-email").value.trim(), password: $("f-pass").value };
    if (mode === "register") payload.name = $("f-name").value.trim();
    try {
      const res = await fetch(`/api/auth/${mode}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || `server said ${res.status}`);
      if (mode === "register") {
        location.href = `/login?registered=1&email=${encodeURIComponent($("f-email").value.trim())}`;
      } else {
        location.href = "/app";
      }
    } catch (err) {
      showError(err.message);
      btn.disabled = false;
    }
  });

  fetch("/api/auth/providers").then((r) => r.json()).then((p) => {
    if (!p.google) {
      const btn = $("google-btn");
      btn.classList.add("off");
      btn.removeAttribute("href");
      btn.onclick = (e) => { e.preventDefault(); showError(ERROR_TEXT.not_configured); };
    }
  }).catch(() => {});
})();
</script>
</body>
</html>
